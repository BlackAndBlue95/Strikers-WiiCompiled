schema_version: 1
workspace_root: ../..

project:
  id: mscharged-r4qe01
  display_name: Mario Strikers Charged USA Rev 1
  game_id: R4QE01
  region: E
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: msc_base

memory:
  base: 0x80000000
  size: 0x01A00000
  sda_base: 0x806E33C0   # from __init_registers @ 0x80006290
  sda2_base: 0x806EB060

inputs:
  dol:
    path: Assets/main.dol
    sha256: 8f811628ee6646c60620a9c599ef08ed929d2eccc98a779c211847f1500f81fd

translation:
  entry_points:
    - 0x80006124   # __start
  function_map:
    path: projects/mscharged/MAP.txt   # generated from mscharged-decomp symbols.txt
  allow_unsupported_instructions: true

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/msc_base_manifest.json

# Code mods: Kamek modules that Riivolution packs put at the disc root as sml_<NN>_<pack>.bin. build.sh
# (translator link-code-mods) folds the installed packs' modules into modules.bin; while it exists the
# base translation accounts for their patches, and translate-mod --profile code-mods builds them in.
# runtime/src/mods/code_mods.cpp wraps init_hook to apply their patches and run their constructors
# where the Strikers Mod Loader does on a console.
profiles:
  code-mods:
    code_pul: generated/kamek_mods/modules.bin
    region: E
    module_guest_base: 0x81800000   # the port's 2 MiB code-mod region above MEM1
    init_hook: 0x80369538           # glplatPreStartup, called from nlInit
    output: generated/kamek_mods/translated
